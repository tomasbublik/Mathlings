<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 4-pointed star: white with yellow center -->

  <!-- Top point -->
  <polygon points="8,1 10,5 8,4 6,5" fill="#FFFFFF" />

  <!-- Right point -->
  <polygon points="15,8 11,10 12,8 11,6" fill="#FFFFFF" />

  <!-- Bottom point -->
  <polygon points="8,15 10,11 8,12 6,11" fill="#FFFFFF" />

  <!-- Left point -->
  <polygon points="1,8 5,10 4,8 5,6" fill="#FFFFFF" />

  <!-- Yellow center -->
  <circle cx="8" cy="8" r="2.5" fill="#FFFF00" />
</svg>
