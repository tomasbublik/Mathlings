<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432">
  <!-- Adaptive icon monochrome layer (Android 13+ themed icons).
       The launcher tints this single-color silhouette to match the
       user's wallpaper-derived theme. White-on-transparent is the
       canonical input format. -->

  <g fill="#FFFFFF">
    <!-- Bear body -->
    <ellipse cx="216" cy="304" rx="106" ry="86"/>
    <!-- Legs -->
    <ellipse cx="158" cy="378" rx="34" ry="22"/>
    <ellipse cx="274" cy="378" rx="34" ry="22"/>
    <!-- Head -->
    <g transform="rotate(-8 216 168)">
      <circle cx="158" cy="118" r="26"/>
      <circle cx="274" cy="118" r="26"/>
      <circle cx="216" cy="168" r="74"/>
    </g>
    <!-- Tablet (slightly inset, just a silhouette) -->
    <rect x="80" y="280" width="272" height="116" rx="14" ry="14"/>
    <!-- Paws -->
    <ellipse cx="92"  cy="338" rx="22" ry="16"/>
    <ellipse cx="340" cy="338" rx="22" ry="16"/>
    <!-- Thought bubble -->
    <circle cx="356" cy="118" r="34"/>
    <circle cx="328" cy="160" r="10"/>
    <circle cx="316" cy="180" r="6"/>
  </g>
</svg>
