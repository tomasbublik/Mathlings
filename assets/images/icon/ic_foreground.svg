<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432">
  <!-- Adaptive icon foreground (432x432).
       Launcher mask reveals only the central ~70%, so all critical
       detail (face + tablet + chin paw) sits inside the safe zone
       roughly between (84,84) and (348,348).

       Palette: warm honey + caramel browns. No true black, no near-black
       (#2A1A0A); even outlines use a soft "#B07F2E" / "#8B5A2B" so the
       whole icon stays cheerful at small sizes. -->

  <defs>
    <linearGradient id="bearBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C078"/>
      <stop offset="100%" stop-color="#C99355"/>
    </linearGradient>
    <linearGradient id="bodyFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A66B36"/>
      <stop offset="100%" stop-color="#7A4A24"/>
    </linearGradient>
    <linearGradient id="tabletScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="tabletFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A07043"/>
      <stop offset="100%" stop-color="#7C5226"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F08C8C" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F08C8C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Stroke colors used everywhere on the bear (kept on a separate variable
       only by convention — SVG has no real variables; copy on edit). -->
  <!-- bear-stroke = #B07F2E   (light caramel)   width 2  -->
  <!-- bear-detail = #8B5A2B   (deeper caramel)  width 3  -->

  <!-- ====== Bear body ====== -->
  <ellipse cx="216" cy="304" rx="106" ry="86"
           fill="url(#bodyFur)" stroke="#B07F2E" stroke-width="2"/>
  <ellipse cx="216" cy="316" rx="74" ry="56" fill="#FBE0B4" opacity="0.9"/>

  <!-- Legs -->
  <ellipse cx="158" cy="378" rx="34" ry="22" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
  <ellipse cx="274" cy="378" rx="34" ry="22" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
  <ellipse cx="158" cy="378" rx="18" ry="12" fill="#FBE0B4"/>
  <ellipse cx="274" cy="378" rx="18" ry="12" fill="#FBE0B4"/>

  <!-- ====== Tablet ====== -->
  <rect x="80" y="280" width="272" height="116" rx="14" ry="14"
        fill="url(#tabletFrame)" stroke="#8B5A2B" stroke-width="2"/>
  <rect x="92" y="292" width="248" height="92" rx="6" ry="6"
        fill="url(#tabletScreen)"/>

  <text x="216" y="324" text-anchor="middle"
        font-family="Verdana, sans-serif" font-size="26" font-weight="bold"
        fill="#1A4D75">7 + 5 = ?</text>

  <g>
    <rect x="108" y="346" width="56" height="28" rx="6" ry="6"
          fill="#FFA94D" stroke="#B36818" stroke-width="2"/>
    <text x="136" y="365" text-anchor="middle" font-family="Verdana, sans-serif"
          font-size="16" font-weight="bold" fill="#7C3F0A">10</text>

    <rect x="188" y="346" width="56" height="28" rx="6" ry="6"
          fill="#7CC97A" stroke="#3F7A33" stroke-width="2"/>
    <text x="216" y="365" text-anchor="middle" font-family="Verdana, sans-serif"
          font-size="16" font-weight="bold" fill="#244F1F">12</text>

    <rect x="268" y="346" width="56" height="28" rx="6" ry="6"
          fill="#5DB4E0" stroke="#1F6B8B" stroke-width="2"/>
    <text x="296" y="365" text-anchor="middle" font-family="Verdana, sans-serif"
          font-size="16" font-weight="bold" fill="#0F4A6A">13</text>
  </g>

  <!-- Right paw rests on tablet -->
  <ellipse cx="340" cy="338" rx="22" ry="16" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>

  <!-- ====== Bear head — tilted, sparkly amused ====== -->
  <g transform="rotate(-15 216 168)">
    <!-- Ears -->
    <circle cx="158" cy="118" r="26" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
    <circle cx="274" cy="118" r="26" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
    <circle cx="158" cy="120" r="13" fill="#F4B7A0"/>
    <circle cx="274" cy="120" r="13" fill="#F4B7A0"/>

    <!-- Head -->
    <circle cx="216" cy="168" r="74" fill="url(#bearBody)"
            stroke="#B07F2E" stroke-width="2"/>

    <!-- Snout -->
    <ellipse cx="216" cy="200" rx="38" ry="30" fill="#FBE0B4"/>

    <!-- Cheeks (rosy) -->
    <ellipse cx="158" cy="200" rx="18" ry="11" fill="url(#cheek)"/>
    <ellipse cx="274" cy="200" rx="18" ry="11" fill="url(#cheek)"/>

    <!-- Eyes — open, sparkling, looking up-right.
         Iris color is a clearly-brown #8B5A2B (not the near-black #6B4A20). -->
    <ellipse cx="190" cy="156" rx="9" ry="10" fill="#8B5A2B"/>
    <ellipse cx="242" cy="156" rx="9" ry="10" fill="#8B5A2B"/>
    <circle cx="194" cy="152" r="3.5" fill="#FFFFFF"/>
    <circle cx="246" cy="152" r="3.5" fill="#FFFFFF"/>
    <circle cx="195.5" cy="150.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="247.5" cy="150.5" r="1.5" fill="#FFFFFF"/>

    <!-- Eyebrows — left normal, right comically arched -->
    <path d="M174 134 Q190 138 204 134" stroke="#8B5A2B" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M226 124 Q244 116 260 128" stroke="#8B5A2B" stroke-width="4"
          fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="216" cy="188" rx="9" ry="6" fill="#8B5A2B"/>
    <ellipse cx="213" cy="186" rx="2.5" ry="1.8" fill="#C99355"/>

    <!-- Mouth — gentle smile -->
    <path d="M216 196 L216 206" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"/>
    <path d="M200 212 Q216 224 232 210" stroke="#8B5A2B" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M212 218 Q216 222 220 218" fill="#E07A8C" stroke="#B85A6C" stroke-width="1"/>
  </g>

  <!-- ====== Left arm raised to chin — anatomically simple ======
       Drawn AFTER the head so it overlaps the snout/jaw.
       Composition is two ellipses (closed shapes, no fill ambiguity):
         · forearm: rotated elongated ellipse from shoulder up to chin
         · paw: small ellipse resting against the snout
       Both share the bear's body color and the soft caramel outline. -->
  <g>
    <!-- Forearm: rotated cylinder going from shoulder area up to chin -->
    <ellipse cx="172" cy="245" rx="20" ry="42"
             fill="#C99355" stroke="#B07F2E" stroke-width="2"
             transform="rotate(20 172 245)"/>
    <!-- Paw resting against the chin -->
    <ellipse cx="190" cy="210" rx="22" ry="17"
             fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
    <!-- Paw pad highlight -->
    <ellipse cx="192" cy="214" rx="12" ry="8" fill="#FBE0B4"/>
    <!-- Three soft pad dots (kept light caramel, not near-black) -->
    <circle cx="184" cy="202" r="2" fill="#B07F2E"/>
    <circle cx="194" cy="200" r="2" fill="#B07F2E"/>
    <circle cx="204" cy="202" r="2" fill="#B07F2E"/>
  </g>

  <!-- ====== Thought bubble — explicit white fills, soft caramel outlines ====== -->
  <g>
    <!-- Smallest bubble (closest to mouth) drawn FIRST so the bigger ones overlap nicely -->
    <circle cx="316" cy="188" r="7"  fill="#FFFFFF" stroke="#D4B98A" stroke-width="2"/>
    <circle cx="328" cy="166" r="11" fill="#FFFFFF" stroke="#C9A66E" stroke-width="2"/>
    <circle cx="356" cy="118" r="36" fill="#FFFFFF" stroke="#B07F2E" stroke-width="3"/>
    <text x="356" y="135" text-anchor="middle" font-family="Verdana, sans-serif"
          font-size="50" font-weight="bold" fill="#B07F2E">?</text>
  </g>
</svg>
