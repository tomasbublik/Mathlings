<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432">
  <!-- Legacy launcher icon (192x192 fallback + project.godot config/icon).
       Composes the adaptive background and foreground into a single image.
       Source-of-truth artwork lives in ic_background.svg + ic_foreground.svg
       — keep these three in sync. -->

  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="grassGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BC95C"/>
      <stop offset="100%" stop-color="#4A8B3D"/>
    </linearGradient>
    <linearGradient id="bearBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C078"/>
      <stop offset="100%" stop-color="#C99355"/>
    </linearGradient>
    <linearGradient id="bodyFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A66B36"/>
      <stop offset="100%" stop-color="#7A4A24"/>
    </linearGradient>
    <linearGradient id="tabletScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="tabletFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A07043"/>
      <stop offset="100%" stop-color="#7C5226"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F08C8C" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F08C8C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundCorners">
      <rect x="0" y="0" width="432" height="432" rx="64" ry="64"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundCorners)">
    <!-- Background -->
    <rect width="432" height="432" fill="url(#skyGradient)"/>
    <g fill="#FFFFFF" opacity="0.85">
      <ellipse cx="78"  cy="92"  rx="36" ry="14"/>
      <ellipse cx="108" cy="86"  rx="28" ry="12"/>
      <ellipse cx="334" cy="120" rx="42" ry="16"/>
      <ellipse cx="368" cy="112" rx="30" ry="13"/>
    </g>
    <circle cx="362" cy="62" r="30" fill="#FFE57B" opacity="0.85"/>
    <circle cx="362" cy="62" r="22" fill="#FFD24A"/>
    <path d="M0 296 Q108 270 216 282 T432 296 L432 432 L0 432 Z" fill="url(#grassGradient)"/>
    <g fill="#3F7A33" opacity="0.55">
      <path d="M40 328  l4 -16 l4 16 z"/>
      <path d="M88 318  l4 -18 l4 18 z"/>
      <path d="M156 332 l4 -16 l4 16 z"/>
      <path d="M268 322 l4 -18 l4 18 z"/>
      <path d="M340 330 l4 -16 l4 16 z"/>
      <path d="M392 318 l4 -18 l4 18 z"/>
    </g>

    <!-- Body + legs -->
    <ellipse cx="216" cy="304" rx="106" ry="86" fill="url(#bodyFur)" stroke="#B07F2E" stroke-width="2"/>
    <ellipse cx="216" cy="316" rx="74"  ry="56" fill="#FBE0B4" opacity="0.9"/>
    <ellipse cx="158" cy="378" rx="34"  ry="22" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
    <ellipse cx="274" cy="378" rx="34"  ry="22" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
    <ellipse cx="158" cy="378" rx="18"  ry="12" fill="#FBE0B4"/>
    <ellipse cx="274" cy="378" rx="18"  ry="12" fill="#FBE0B4"/>

    <!-- Tablet -->
    <rect x="80" y="280" width="272" height="116" rx="14" ry="14" fill="url(#tabletFrame)" stroke="#8B5A2B" stroke-width="2"/>
    <rect x="92" y="292" width="248" height="92"  rx="6"  ry="6"  fill="url(#tabletScreen)"/>
    <text x="216" y="324" text-anchor="middle" font-family="Verdana, sans-serif"
          font-size="26" font-weight="bold" fill="#1A4D75">7 + 5 = ?</text>
    <rect x="108" y="346" width="56" height="28" rx="6" ry="6" fill="#FFA94D" stroke="#B36818" stroke-width="2"/>
    <text x="136" y="365" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#7C3F0A">10</text>
    <rect x="188" y="346" width="56" height="28" rx="6" ry="6" fill="#7CC97A" stroke="#3F7A33" stroke-width="2"/>
    <text x="216" y="365" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#244F1F">12</text>
    <rect x="268" y="346" width="56" height="28" rx="6" ry="6" fill="#5DB4E0" stroke="#1F6B8B" stroke-width="2"/>
    <text x="296" y="365" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#0F4A6A">13</text>

    <ellipse cx="340" cy="338" rx="22" ry="16" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>

    <!-- Head -->
    <g transform="rotate(-15 216 168)">
      <circle cx="158" cy="118" r="26" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
      <circle cx="274" cy="118" r="26" fill="#C99355" stroke="#B07F2E" stroke-width="2"/>
      <circle cx="158" cy="120" r="13" fill="#F4B7A0"/>
      <circle cx="274" cy="120" r="13" fill="#F4B7A0"/>
      <circle cx="216" cy="168" r="74" fill="url(#bearBody)" stroke="#B07F2E" stroke-width="2"/>
      <ellipse cx="216" cy="200" rx="38" ry="30" fill="#FBE0B4"/>
      <ellipse cx="158" cy="200" rx="18" ry="11" fill="url(#cheek)"/>
      <ellipse cx="274" cy="200" rx="18" ry="11" fill="url(#cheek)"/>

      <ellipse cx="190" cy="156" rx="9" ry="10" fill="#8B5A2B"/>
      <ellipse cx="242" cy="156" rx="9" ry="10" fill="#8B5A2B"/>
      <circle cx="194" cy="152" r="3.5" fill="#FFFFFF"/>
      <circle cx="246" cy="152" r="3.5" fill="#FFFFFF"/>
      <circle cx="195.5" cy="150.5" r="1.5" fill="#FFFFFF"/>
      <circle cx="247.5" cy="150.5" r="1.5" fill="#FFFFFF"/>

      <path d="M174 134 Q190 138 204 134" stroke="#8B5A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M226 124 Q244 116 260 128" stroke="#8B5A2B" stroke-width="4" fill="none" stroke-linecap="round"/>

      <ellipse cx="216" cy="188" rx="9" ry="6" fill="#8B5A2B"/>
      <ellipse cx="213" cy="186" rx="2.5" ry="1.8" fill="#C99355"/>

      <path d="M216 196 L216 206" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"/>
      <path d="M200 212 Q216 224 232 210" stroke="#8B5A2B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M212 218 Q216 222 220 218" fill="#E07A8C" stroke="#B85A6C" stroke-width="1"/>
    </g>

    <!-- Left arm raised to chin (forearm + paw, two closed ellipses) -->
    <g>
      <ellipse cx="172" cy="245" rx="20" ry="42" fill="#C99355"
               stroke="#B07F2E" stroke-width="2" transform="rotate(20 172 245)"/>
      <ellipse cx="190" cy="210" rx="22" ry="17" fill="#C99355"
               stroke="#B07F2E" stroke-width="2"/>
      <ellipse cx="192" cy="214" rx="12" ry="8" fill="#FBE0B4"/>
      <circle cx="184" cy="202" r="2" fill="#B07F2E"/>
      <circle cx="194" cy="200" r="2" fill="#B07F2E"/>
      <circle cx="204" cy="202" r="2" fill="#B07F2E"/>
    </g>

    <!-- Thought bubble — explicit white fills, soft caramel outlines -->
    <circle cx="316" cy="188" r="7"  fill="#FFFFFF" stroke="#D4B98A" stroke-width="2"/>
    <circle cx="328" cy="166" r="11" fill="#FFFFFF" stroke="#C9A66E" stroke-width="2"/>
    <circle cx="356" cy="118" r="36" fill="#FFFFFF" stroke="#B07F2E" stroke-width="3"/>
    <text x="356" y="135" text-anchor="middle" font-family="Verdana, sans-serif"
          font-size="50" font-weight="bold" fill="#B07F2E">?</text>
  </g>
</svg>
