<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)" />

  <!-- Cloud 1 -->
  <ellipse cx="300" cy="200" rx="120" ry="60" fill="#FFFFFF" opacity="0.9" />
  <ellipse cx="380" cy="180" rx="100" ry="50" fill="#FFFFFF" opacity="0.9" />
  <ellipse cx="220" cy="190" rx="90" ry="45" fill="#FFFFFF" opacity="0.9" />

  <!-- Cloud 2 -->
  <ellipse cx="1400" cy="400" rx="140" ry="70" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="1520" cy="370" rx="120" ry="60" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="1280" cy="390" rx="110" ry="55" fill="#FFFFFF" opacity="0.8" />

  <!-- Cloud 3 -->
  <ellipse cx="700" cy="150" rx="100" ry="50" fill="#FFFFFF" opacity="0.85" />
  <ellipse cx="800" cy="140" rx="90" ry="45" fill="#FFFFFF" opacity="0.85" />
</svg>
