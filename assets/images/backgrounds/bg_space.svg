<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330066;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Space background -->
  <rect width="1920" height="1080" fill="url(#spaceGradient)" />

  <!-- Star 1 (white) -->
  <circle cx="150" cy="120" r="3" fill="#FFFFFF" opacity="1" />

  <!-- Star 2 (yellow) -->
  <circle cx="450" cy="280" r="2.5" fill="#FFFF99" opacity="0.9" />

  <!-- Star 3 (white) -->
  <circle cx="800" cy="150" r="3" fill="#FFFFFF" opacity="0.9" />

  <!-- Star 4 (white) -->
  <circle cx="1200" cy="420" r="2" fill="#FFFFFF" opacity="0.8" />

  <!-- Star 5 (yellow) -->
  <circle cx="1600" cy="200" r="2.5" fill="#FFFF99" opacity="0.85" />

  <!-- Star 6 (white) -->
  <circle cx="350" cy="700" r="2.5" fill="#FFFFFF" opacity="0.7" />

  <!-- Star 7 (white) -->
  <circle cx="1100" cy="850" r="2" fill="#FFFFFF" opacity="0.8" />

  <!-- Star 8 (yellow) -->
  <circle cx="1700" cy="650" r="2" fill="#FFFF99" opacity="0.75" />
</svg>
