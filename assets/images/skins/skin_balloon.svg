<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Red balloon (circle) -->
  <circle cx="64" cy="50" r="35" fill="#FF3333" stroke="#CC0000" stroke-width="1" />

  <!-- Shine/highlight -->
  <ellipse cx="50" cy="35" rx="12" ry="18" fill="#FF6666" opacity="0.6" />

  <!-- String -->
  <line x1="64" y1="85" x2="64" y2="110" stroke="#333333" stroke-width="1" />

  <!-- Knot (triangle) -->
  <polygon points="60,110 68,110 64,120" fill="#CCCCCC" />
</svg>
