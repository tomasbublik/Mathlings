<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Classic flying saucer: wide chrome disc + glass dome + tractor lights. -->

  <!-- Lower disc (the "saucer"). -->
  <ellipse cx="64" cy="74" rx="54" ry="14"
           fill="#9BA3B0" stroke="#3F4555" stroke-width="3"/>
  <!-- Highlight strip across the disc for chrome feel. -->
  <ellipse cx="56" cy="71" rx="34" ry="3" fill="#E8ECF1" opacity="0.85"/>

  <!-- Dome (green glass) sitting on top. -->
  <path d="M30 74 A 34 34 0 0 1 98 74 Z"
        fill="#7DD8A4" stroke="#256E48" stroke-width="3" stroke-linejoin="round"/>
  <!-- Dome highlight. -->
  <ellipse cx="50" cy="56" rx="12" ry="14" fill="#C7F0DA" opacity="0.7"/>

  <!-- Three tractor-beam lights along the bottom rim. -->
  <g fill="#9D5BD2" stroke="#5A2D87" stroke-width="2">
    <circle cx="32" cy="80" r="5"/>
    <circle cx="64" cy="84" r="5"/>
    <circle cx="96" cy="80" r="5"/>
  </g>
</svg>
