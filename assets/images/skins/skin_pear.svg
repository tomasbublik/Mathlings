<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Classic pear silhouette: a small upper bulb merged with a larger lower one.
       Two ellipses + a connecting path keeps the contour smooth. -->
  <path d="M64 18
           C 50 18 46 30 50 42
           C 36 52 30 76 42 96
           C 52 112 76 112 86 96
           C 98 76 92 52 78 42
           C 82 30 78 18 64 18 Z"
        fill="#9DCB46" stroke="#3F7A33" stroke-width="3" stroke-linejoin="round"/>
  <!-- Soft inner highlight on the left flank. -->
  <ellipse cx="50" cy="78" rx="8" ry="20" fill="#C8E68A" opacity="0.6"/>
  <!-- Brown stem + small green leaf. -->
  <rect x="61" y="10" width="6" height="12" fill="#5A3A14" rx="1"/>
  <ellipse cx="78" cy="14" rx="10" ry="5" fill="#3F7A33"
           transform="rotate(-25 78 14)"/>
</svg>
