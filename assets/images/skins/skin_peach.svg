<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Peach: blushed circle with a vertical seam crease (cleft). -->
  <circle cx="64" cy="68" r="44" fill="#F8B279" stroke="#A8521E" stroke-width="3"/>
  <!-- Pinkish flush on the top-right where peaches typically blush. -->
  <ellipse cx="80" cy="50" rx="20" ry="22" fill="#F4827D" opacity="0.7"/>
  <!-- Vertical crease running down the middle. -->
  <path d="M64 28 Q60 64 64 108" stroke="#A8521E" stroke-width="2"
        fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Soft highlight. -->
  <ellipse cx="46" cy="50" rx="10" ry="14" fill="#FCD8B0" opacity="0.7"/>
  <!-- Single leaf at the stem. -->
  <ellipse cx="78" cy="22" rx="14" ry="7" fill="#3F7A33"
           stroke="#1F4F1A" stroke-width="1.5" transform="rotate(-25 78 22)"/>
  <rect x="62" y="14" width="6" height="14" fill="#5A3A14" rx="1.5"/>
</svg>
